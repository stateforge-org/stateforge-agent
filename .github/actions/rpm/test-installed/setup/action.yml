name: Prepare an installed-Agent scenario
description: Verify a fixture bundle, install the RPM, and start the packaged Agent.

inputs:
  rpm-directory:
    description: Directory containing the exact RPM artifact under test.
    required: false
    default: dist/rpm
  evidence-directory:
    description: Directory receiving installed-system evidence.
    required: false
    default: dist/agent-system-test-evidence
  fixture-directory:
    description: Directory containing the prebuilt Provider fixture bundle.
    required: false
    default: dist/provider-fixture

outputs:
  container-name:
    description: Fedora container running the installed Agent.
    value: ${{ steps.agent.outputs.container-name }}
  fixture-path:
    description: Prepared Provider fixture entry point.
    value: ${{ steps.fixture.outputs.fixture-path }}
  wheel-directory:
    description: Directory containing the Provider and Protocol wheels.
    value: ${{ steps.fixture.outputs.wheel-directory }}

runs:
  using: composite
  steps:
    - name: Verify Provider fixture bundle
      id: fixture
      shell: bash
      env:
        FIXTURE_DIRECTORY: ${{ inputs.fixture-directory }}
      run: |
        set -euo pipefail
        if [[ ! -f "${FIXTURE_DIRECTORY}/provider.py" || \
              ! -f "${FIXTURE_DIRECTORY}/dependency-provenance.json" || \
              ! -f "${FIXTURE_DIRECTORY}/SHA256SUMS" ]]; then
          printf 'Provider fixture bundle is incomplete: %s\n' \
            "${FIXTURE_DIRECTORY}" >&2
          exit 1
        fi
        (
          cd -- "${FIXTURE_DIRECTORY}"
          sha256sum --check SHA256SUMS
        )
        mapfile -t protocol_wheels < <(
          find "${FIXTURE_DIRECTORY}/wheels" -maxdepth 1 -type f \
            -name 'stateforge_protocol-*.whl' -print
        )
        mapfile -t provider_wheels < <(
          find "${FIXTURE_DIRECTORY}/wheels" -maxdepth 1 -type f \
            -name 'stateforge_provider-*.whl' -print
        )
        if (( ${#protocol_wheels[@]} != 1 || ${#provider_wheels[@]} != 1 )); then
          printf 'Expected one Protocol wheel and one Provider wheel.\n' >&2
          exit 1
        fi
        fixture_directory="$(cd -- "${FIXTURE_DIRECTORY}" && pwd -P)"
        {
          printf 'fixture-path=%s/provider.py\n' "${fixture_directory}"
          printf 'provenance-path=%s/dependency-provenance.json\n' \
            "${fixture_directory}"
          printf 'wheel-directory=%s/wheels\n' "${fixture_directory}"
        } >> "${GITHUB_OUTPUT}"

    - name: Preserve dependency provenance
      shell: bash
      env:
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        PROVENANCE_PATH: ${{ steps.fixture.outputs.provenance-path }}
      run: |
        mkdir -p "${EVIDENCE_DIRECTORY}"
        install -m 0644 "${PROVENANCE_PATH}" \
          "${EVIDENCE_DIRECTORY}/dependency-provenance.json"

    - name: Install Agent RPM
      id: agent
      uses: ./.github/actions/agent/install
      with:
        rpm-directory: ${{ inputs.rpm-directory }}
        dependency-wheel-directory: ${{ steps.fixture.outputs.wheel-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}

    - name: Start Agent service
      uses: ./.github/actions/agent/start
      with:
        container-name: ${{ steps.agent.outputs.container-name }}
