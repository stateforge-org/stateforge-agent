name: Test installed manifest exchange
description: Verify that the RPM-installed Agent accepts one public-API Provider manifest.

inputs:
  rpm-directory:
    description: Directory containing the exact RPM artifact under test.
    required: false
    default: dist/rpm
  evidence-directory:
    description: Directory receiving this scenario's evidence.
    required: false
    default: dist/agent-system-test-evidence/manifest-exchange
  fixture-directory:
    description: Directory containing the prebuilt Provider fixture bundle.
    required: false
    default: dist/provider-fixture

outputs:
  evidence-directory:
    description: Absolute directory containing scenario evidence.
    value: ${{ steps.cleanup.outputs.evidence-directory }}

runs:
  using: composite
  steps:
    - name: Prepare installed Agent
      id: setup
      uses: ./.github/actions/rpm/test-installed/setup
      with:
        rpm-directory: ${{ inputs.rpm-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}
        fixture-directory: ${{ inputs.fixture-directory }}

    - name: Start Provider fixture
      id: provider
      uses: ./.github/actions/provider/start
      with:
        container-name: ${{ steps.setup.outputs.container-name }}
        fixture-path: ${{ steps.setup.outputs.fixture-path }}
        wheel-directory: ${{ steps.setup.outputs.wheel-directory }}

    - name: Assert Provider manifest exchange
      uses: ./.github/actions/provider/assert-manifest
      with:
        container-name: ${{ steps.setup.outputs.container-name }}
        provider-instance-id: ${{ steps.provider.outputs.provider-instance-id }}
        endpoint-generation: ${{ steps.provider.outputs.endpoint-generation }}
        journal-cursor: ${{ steps.provider.outputs.agent-journal-cursor }}
        evidence-directory: ${{ inputs.evidence-directory }}

    - name: Preserve evidence and clean up
      id: cleanup
      if: ${{ always() }}
      uses: ./.github/actions/rpm/test-installed/cleanup
      with:
        container-name: stateforge-agent-system-test
        evidence-directory: ${{ inputs.evidence-directory }}
