name: Create Provider fixture bundle
description: Build dependency revisions through their canonical actions and stage a fixture.

inputs:
  repository-token:
    description: Short-lived token with read access to Protocol and Provider.
    required: true
  fixture:
    description: Provider fixture name from this action's fixture directory.
    required: false
    default: manifest
  output-directory:
    description: Directory that receives fixture files and dependency wheels.
    required: false
    default: dist/provider-fixture
  provider-repository:
    description: Repository containing the Provider runtime package.
    required: false
    default: stateforge-org/stateforge-provider-python
  provider-ref:
    description: Provider revision to build; use a commit for reproducible runs.
    required: false
    default: mvp/implementation
  protocol-repository:
    description: Repository containing the public Protocol package.
    required: false
    default: stateforge-org/stateforge-protocol
  protocol-ref:
    description: Protocol revision to build; use a commit for reproducible runs.
    required: false
    default: mvp/implementation

outputs:
  fixture-path:
    description: Absolute path to the staged Provider fixture.
    value: ${{ steps.stage.outputs.fixture-path }}
  provenance-path:
    description: Requested refs, resolved commits, and wheel hashes.
    value: ${{ steps.stage.outputs.provenance-path }}
  wheel-directory:
    description: Absolute path containing Provider and Protocol wheels.
    value: ${{ steps.stage.outputs.wheel-directory }}

runs:
  using: composite
  steps:
    - name: Check out Protocol source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.protocol-repository }}
        ref: ${{ inputs.protocol-ref }}
        path: .stateforge-ci/sources/protocol
        token: ${{ inputs.repository-token }}
        persist-credentials: false

    - name: Check out Provider source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.provider-repository }}
        ref: ${{ inputs.provider-ref }}
        path: .stateforge-ci/sources/provider
        token: ${{ inputs.repository-token }}
        persist-credentials: false

    - name: Set up package builder
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install package builder
      shell: bash
      run: python -m pip install --disable-pip-version-check "build>=1.2"

    - name: Prepare fixture bundle directories
      id: prepare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FIXTURE: ${{ inputs.fixture }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        fixture_source="${ACTION_PATH}/fixtures/${FIXTURE}.py"
        if [[ ! -f "${fixture_source}" ]]; then
          printf 'Unknown Provider fixture: %s\n' "${FIXTURE}" >&2
          exit 2
        fi

        rm -rf -- "${OUTPUT_DIRECTORY}"
        mkdir -p \
          "${OUTPUT_DIRECTORY}/packages/protocol" \
          "${OUTPUT_DIRECTORY}/packages/provider" \
          "${OUTPUT_DIRECTORY}/evidence/protocol" \
          "${OUTPUT_DIRECTORY}/evidence/provider" \
          "${OUTPUT_DIRECTORY}/wheels"
        output_directory="$(cd -- "${OUTPUT_DIRECTORY}" && pwd -P)"
        {
          printf 'fixture-source=%s\n' "${fixture_source}"
          printf 'output-directory=%s\n' "${output_directory}"
        } >> "${GITHUB_OUTPUT}"

    - name: Build Protocol package through its canonical action
      id: protocol
      uses: ./.stateforge-ci/sources/protocol/.github/actions/python/build
      with:
        output-directory: ${{ steps.prepare.outputs.output-directory }}/packages/protocol
        evidence-directory: ${{ steps.prepare.outputs.output-directory }}/evidence/protocol

    - name: Build Provider package through its canonical action
      id: provider
      uses: ./.stateforge-ci/sources/provider/.github/actions/package/build
      with:
        output-directory: ${{ steps.prepare.outputs.output-directory }}/packages/provider
        evidence-directory: ${{ steps.prepare.outputs.output-directory }}/evidence/provider

    - name: Stage fixture and package identity
      id: stage
      shell: bash
      env:
        FIXTURE_SOURCE: ${{ steps.prepare.outputs.fixture-source }}
        OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output-directory }}
        PROVIDER_REF: ${{ inputs.provider-ref }}
        PROVIDER_REPOSITORY: ${{ inputs.provider-repository }}
        PROVIDER_WHEEL: ${{ steps.provider.outputs.wheel-path }}
        PROVIDER_WHEEL_SHA256: ${{ steps.provider.outputs.wheel-sha256 }}
        PROTOCOL_REF: ${{ inputs.protocol-ref }}
        PROTOCOL_REPOSITORY: ${{ inputs.protocol-repository }}
        PROTOCOL_WHEEL: ${{ steps.protocol.outputs.wheel-path }}
        PROTOCOL_WHEEL_SHA256: ${{ steps.protocol.outputs.wheel-sha256 }}
      run: |
        set -euo pipefail
        (
          cd -- "${OUTPUT_DIRECTORY}/packages/protocol"
          sha256sum --check SHA256SUMS
        )
        (
          cd -- "${OUTPUT_DIRECTORY}/packages/provider"
          sha256sum --check SHA256SUMS
        )
        install -m 0644 "${PROTOCOL_WHEEL}" "${OUTPUT_DIRECTORY}/wheels/"
        install -m 0644 "${PROVIDER_WHEEL}" "${OUTPUT_DIRECTORY}/wheels/"

        protocol_commit="$(
          git -C .stateforge-ci/sources/protocol rev-parse --verify HEAD
        )"
        provider_commit="$(
          git -C .stateforge-ci/sources/provider rev-parse --verify HEAD
        )"
        jq -n \
          --arg protocol_repository "${PROTOCOL_REPOSITORY}" \
          --arg protocol_ref "${PROTOCOL_REF}" \
          --arg protocol_commit "${protocol_commit}" \
          --arg protocol_wheel "$(basename -- "${PROTOCOL_WHEEL}")" \
          --arg protocol_sha256 "${PROTOCOL_WHEEL_SHA256}" \
          --arg provider_repository "${PROVIDER_REPOSITORY}" \
          --arg provider_ref "${PROVIDER_REF}" \
          --arg provider_commit "${provider_commit}" \
          --arg provider_wheel "$(basename -- "${PROVIDER_WHEEL}")" \
          --arg provider_sha256 "${PROVIDER_WHEEL_SHA256}" \
          '{
            schema_version: 1,
            dependencies: [
              {
                repository: $protocol_repository,
                requested_ref: $protocol_ref,
                resolved_commit: $protocol_commit,
                wheel: $protocol_wheel,
                wheel_sha256: $protocol_sha256
              },
              {
                repository: $provider_repository,
                requested_ref: $provider_ref,
                resolved_commit: $provider_commit,
                wheel: $provider_wheel,
                wheel_sha256: $provider_sha256
              }
            ]
          }' > "${OUTPUT_DIRECTORY}/dependency-provenance.json"
        install -m 0644 "${FIXTURE_SOURCE}" \
          "${OUTPUT_DIRECTORY}/provider.py"
        (
          cd -- "${OUTPUT_DIRECTORY}"
          sha256sum provider.py wheels/*.whl > SHA256SUMS
        )

        output_directory="$(cd -- "${OUTPUT_DIRECTORY}" && pwd -P)"
        {
          printf 'fixture-path=%s/provider.py\n' "${output_directory}"
          printf 'provenance-path=%s/dependency-provenance.json\n' \
            "${output_directory}"
          printf 'wheel-directory=%s/wheels\n' "${output_directory}"
        } >> "${GITHUB_OUTPUT}"
