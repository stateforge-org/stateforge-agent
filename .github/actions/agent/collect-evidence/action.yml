name: Collect Agent system-test evidence
description: Capture bounded service evidence, uninstall the RPM, and clean up.

inputs:
  container-name:
    description: Fedora system-test container to inspect and remove.
    required: false
    default: stateforge-agent-system-test
  evidence-directory:
    description: Host directory receiving sanitized test evidence.
    required: false
    default: dist/agent-system-test-evidence

outputs:
  evidence-directory:
    description: Absolute host evidence directory.
    value: ${{ steps.collect.outputs.evidence-directory }}

runs:
  using: composite
  steps:
    - name: Collect evidence and clean up
      id: collect
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
      run: |
        mkdir -p "${EVIDENCE_DIRECTORY}"
        evidence_directory="$(cd -- "${EVIDENCE_DIRECTORY}" && pwd -P)"
        printf 'evidence-directory=%s\n' "${evidence_directory}" \
          >> "${GITHUB_OUTPUT}"

        if ! docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
          printf 'System-test container was not created.\n' \
            > "${EVIDENCE_DIRECTORY}/container-missing.txt"
          exit 0
        fi

        /bin/bash "${GITHUB_ACTION_PATH}/collect-diagnostics.sh" \
          "${CONTAINER_NAME}" "${EVIDENCE_DIRECTORY}"

        status=0
        docker exec "${CONTAINER_NAME}" \
          systemctl stop 'stateforge-test-*' stateforge-agent.service \
          > "${EVIDENCE_DIRECTORY}/service-stop.txt" 2>&1 || true
        docker exec "${CONTAINER_NAME}" rpm -e stateforge-agent \
          > "${EVIDENCE_DIRECTORY}/rpm-remove.txt" 2>&1 || status=$?
        if docker exec "${CONTAINER_NAME}" \
          test -e /usr/bin/stateforge-agent; then
          printf 'RPM removal left /usr/bin/stateforge-agent behind.\n' \
            >> "${EVIDENCE_DIRECTORY}/rpm-remove.txt"
          status=1
        fi
        docker rm --force "${CONTAINER_NAME}" >/dev/null 2>&1 || status=1
        exit "${status}"
