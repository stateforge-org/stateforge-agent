name: Start StateForge Agent
description: Start the installed systemd service and wait for readiness.

inputs:
  container-name:
    description: Fedora system-test container created by the install action.
    required: false
    default: stateforge-agent-system-test
  timeout-seconds:
    description: Maximum time to wait for the service readiness log.
    required: false
    default: "60"

outputs:
  service-state:
    description: Final systemd active state.
    value: ${{ steps.start.outputs.service-state }}
  service-invocation-id:
    description: systemd invocation that emitted the readiness event.
    value: ${{ steps.start.outputs.service-invocation-id }}

runs:
  using: composite
  steps:
    - name: Start installed Agent service
      id: start
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        /bin/bash "${ACTION_PATH}/start.sh" \
          "${CONTAINER_NAME}" "${TIMEOUT_SECONDS}" "${GITHUB_OUTPUT}"
