name: Start StateForge Agent
description: Start the installed systemd service and wait for readiness.

inputs:
  container-name:
    description: Fedora system-test container created by the install action.
    required: false
    default: stateforge-agent-system-test
  timeout-seconds:
    description: Maximum time to wait for the service readiness log.
    required: false
    default: "60"

outputs:
  service-state:
    description: Final systemd active state.
    value: ${{ steps.start.outputs.service-state }}

runs:
  using: composite
  steps:
    - name: Start installed Agent service
      id: start
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        docker exec "${CONTAINER_NAME}" systemctl daemon-reload
        docker exec "${CONTAINER_NAME}" systemctl start stateforge-agent.service

        deadline=$((SECONDS + TIMEOUT_SECONDS))
        while (( SECONDS < deadline )); do
          state="$(docker exec "${CONTAINER_NAME}" \
            systemctl is-active stateforge-agent.service 2>/dev/null || true)"
          if [[ "${state}" == "active" ]] && docker exec \
            "${CONTAINER_NAME}" journalctl -u stateforge-agent.service \
              --no-pager -o cat | grep -Fq 'StateForge Agent started'; then
            printf 'service-state=%s\n' "${state}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${state}" == "failed" || "${state}" == "inactive" ]]; then
            break
          fi
          sleep 1
        done

        docker exec "${CONTAINER_NAME}" \
          systemctl status stateforge-agent.service --no-pager || true
        docker exec "${CONTAINER_NAME}" \
          journalctl -u stateforge-agent.service --no-pager || true
        printf 'Agent service did not become ready.\n' >&2
        exit 1
