name: Assert Agent Provider availability
description: Require one generation-scoped availability transition in Agent logs.

inputs:
  container-name:
    description: Fedora container running the installed Agent.
    required: true
  provider-instance-id:
    description: Provider installation identity whose status is expected.
    required: true
  endpoint-generation:
    description: Exact endpoint generation whose status is expected.
    required: true
  state:
    description: Expected Agent availability state.
    required: true
  journal-cursor:
    description: Agent journal boundary captured before the triggering action.
    required: true
  evidence-directory:
    description: Host directory receiving the matched transition.
    required: true
  timeout-seconds:
    description: Maximum time to wait for the expected transition.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Assert transition-scoped Agent availability
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        ENDPOINT_GENERATION: ${{ inputs.endpoint-generation }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        JOURNAL_CURSOR: ${{ inputs.journal-cursor }}
        PROVIDER_INSTANCE_ID: ${{ inputs.provider-instance-id }}
        STATE: ${{ inputs.state }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        case "${STATE}" in
          unavailable|watching|available|unknown|not_serving|service_unknown|watch_unsupported)
            ;;
          *)
            printf 'Unknown Agent availability state: %s\n' "${STATE}" >&2
            exit 2
            ;;
        esac
        if [[ ! "${ENDPOINT_GENERATION}" =~ ^[1-9][0-9]*$ || \
              ! "${TIMEOUT_SECONDS}" =~ ^[1-9][0-9]*$ || \
              -z "${JOURNAL_CURSOR}" ]]; then
          printf 'Availability assertion inputs are invalid.\n' >&2
          exit 2
        fi

        mkdir -p "${EVIDENCE_DIRECTORY}"
        cursor_digest="$(printf '%s' "${JOURNAL_CURSOR}" \
          | sha256sum | cut -c1-12)"
        evidence="${EVIDENCE_DIRECTORY}/${STATE}-${cursor_digest}.txt"
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        journal=""
        while (( SECONDS < deadline )); do
          if ! journal="$(docker exec "${CONTAINER_NAME}" \
            journalctl -u stateforge-agent.service --no-pager -o cat \
              "--after-cursor=${JOURNAL_CURSOR}")"; then
            printf 'Could not read the transition-scoped Agent journal.\n' >&2
            exit 1
          fi

          set +e
          match="$(printf '%s\n' "${journal}" \
            | /bin/bash "${ACTION_PATH}/check-journal.sh" \
              "${PROVIDER_INSTANCE_ID}" "${ENDPOINT_GENERATION}" \
              "${STATE}")"
          match_status=$?
          set -e
          case "${match_status}" in
            0)
              printf '%s\n' "${match}" > "${evidence}"
              exit 0
              ;;
            3)
              ;;
            *)
              printf 'Availability journal classifier failed with status %s.\n' \
                "${match_status}" >&2
              exit 1
              ;;
          esac
          sleep 1
        done

        printf '%s\n' "${journal}" \
          > "${EVIDENCE_DIRECTORY}/${STATE}-${cursor_digest}-scoped-journal.txt"
        docker exec "${CONTAINER_NAME}" \
          journalctl -u stateforge-agent.service --no-pager || true
        printf 'Agent did not report state=%s for Provider %s generation %s.\n' \
          "${STATE}" "${PROVIDER_INSTANCE_ID}" \
          "${ENDPOINT_GENERATION}" >&2
        exit 1
