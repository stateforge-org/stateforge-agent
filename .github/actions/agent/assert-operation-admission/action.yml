name: Assert Agent Operation Admission
description: Exercise the RPM-installed Agent client against a real Provider.

inputs:
  container-name:
    description: Fedora container running the installed Agent and Provider.
    required: true
  provider-instance-id:
    description: Provider installation identity published by the fixture.
    required: true
  provider-state-name:
    description: Primary fixture state directory containing operation evidence.
    required: false
    default: provider-a
  provider-unit-name:
    description: Primary Provider systemd unit replaced during recovery.
    required: true
  secondary-provider-instance-id:
    description: Second Provider identity used to prove isolation.
    required: true
  secondary-provider-state-name:
    description: Secondary fixture state directory containing evidence.
    required: false
    default: provider-b
  evidence-directory:
    description: Host directory receiving sanitized admission evidence.
    required: true

runs:
  using: composite
  steps:
    - name: Exercise installed Agent Operation Admission
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        PROVIDER_INSTANCE_ID: ${{ inputs.provider-instance-id }}
        PROVIDER_STATE_NAME: ${{ inputs.provider-state-name }}
        PROVIDER_UNIT_NAME: ${{ inputs.provider-unit-name }}
        SECONDARY_PROVIDER_INSTANCE_ID: ${{ inputs.secondary-provider-instance-id }}
        SECONDARY_PROVIDER_STATE_NAME: ${{ inputs.secondary-provider-state-name }}
      run: |
        set -euo pipefail
        mkdir -p "${EVIDENCE_DIRECTORY}"
        verifier_directory="/opt/stateforge-agent-tests/operation-admission"
        verifier="${verifier_directory}/assert.py"
        state_directory="/var/lib/stateforge-provider-fixtures/${PROVIDER_STATE_NAME}"
        secondary_state_directory="/var/lib/stateforge-provider-fixtures/${SECONDARY_PROVIDER_STATE_NAME}"
        docker exec "${CONTAINER_NAME}" mkdir -p "${verifier_directory}"
        docker cp "${ACTION_PATH}/assert.py" \
          "${CONTAINER_NAME}:${verifier}"
        set +e
        docker exec "${CONTAINER_NAME}" /usr/bin/python3 "${verifier}" \
          --provider-instance-id "${PROVIDER_INSTANCE_ID}" \
          --state-directory "${state_directory}" \
          --provider-unit-name "${PROVIDER_UNIT_NAME}" \
          --secondary-provider-instance-id \
            "${SECONDARY_PROVIDER_INSTANCE_ID}" \
          --secondary-state-directory "${secondary_state_directory}" \
          > "${EVIDENCE_DIRECTORY}/operation-admission.json"
        status=$?
        set -e
        docker exec "${CONTAINER_NAME}" cat "${state_directory}/events.log" \
          > "${EVIDENCE_DIRECTORY}/operation-events.txt" 2>&1 || true
        docker exec "${CONTAINER_NAME}" sha256sum \
          "${state_directory}/target-state.txt" \
          > "${EVIDENCE_DIRECTORY}/target-sha256.txt" 2>&1 || true
        docker exec "${CONTAINER_NAME}" cat \
          "${secondary_state_directory}/events.log" \
          > "${EVIDENCE_DIRECTORY}/secondary-operation-events.txt" \
          2>&1 || true
        docker exec "${CONTAINER_NAME}" sha256sum \
          "${secondary_state_directory}/target-state.txt" \
          > "${EVIDENCE_DIRECTORY}/secondary-target-sha256.txt" \
          2>&1 || true
        exit "${status}"
