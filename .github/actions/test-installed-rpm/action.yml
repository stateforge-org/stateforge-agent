name: Test installed StateForge Agent RPM
description: Install the exact RPM in clean Fedora, verify it, and remove it.

inputs:
  rpm-directory:
    description: Directory containing one binary StateForge Agent RPM.
    required: false
    default: dist/rpm
  evidence-directory:
    description: Directory that receives package and service evidence.
    required: false
    default: dist/rpm-test-evidence
  container-image:
    description: Local tag for the Fedora systemd test image.
    required: false
    default: stateforge-agent-rpm-test:fedora42

outputs:
  evidence-directory:
    description: Absolute path to the installed-package evidence.
    value: ${{ steps.test.outputs.evidence-directory }}

runs:
  using: composite
  steps:
    - name: Verify artifact checksums
      shell: bash
      env:
        INPUT_RPM_DIRECTORY: ${{ inputs.rpm-directory }}
      run: |
        cd "${INPUT_RPM_DIRECTORY}"
        sha256sum --check SHA256SUMS

    - name: Install, verify, and remove RPM
      id: test
      shell: bash
      env:
        INPUT_RPM_DIRECTORY: ${{ inputs.rpm-directory }}
        INPUT_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        INPUT_CONTAINER_IMAGE: ${{ inputs.container-image }}
      run: |
        mapfile -t rpms < <(
          find "${INPUT_RPM_DIRECTORY}" -maxdepth 1 -type f \
            -name 'stateforge-agent-*.rpm' ! -name '*.src.rpm' -print
        )
        if (( ${#rpms[@]} != 1 )); then
          printf 'Expected exactly one binary Agent RPM, found %d.\n' \
            "${#rpms[@]}" >&2
          exit 1
        fi
        packaging/rpm/test-installed-rpm.sh \
          --rpm "${rpms[0]}" \
          --evidence-directory "${INPUT_EVIDENCE_DIRECTORY}" \
          --container-image "${INPUT_CONTAINER_IMAGE}"
