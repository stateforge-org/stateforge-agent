name: RPM release candidate

on:
  workflow_dispatch:
    inputs:
      provider-ref:
        description: Provider branch, tag, or commit SHA to test.
        required: false
        type: string
        default: mvp/implementation
      protocol-ref:
        description: Protocol branch, tag, or commit SHA to test.
        required: false
        type: string
        default: mvp/implementation
      retention-days:
        description: Number of days to retain the tested candidate.
        required: false
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: rpm-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpm:
    name: Build and test release candidate
    uses: ./.github/workflows/rpm-build-and-test.yml
    with:
      artifact-name: stateforge-agent-rpm-candidate-${{ github.run_id }}
      provider-ref: ${{ inputs.provider-ref }}
      protocol-ref: ${{ inputs.protocol-ref }}
      retention-days: ${{ inputs.retention-days }}
    secrets:
      source_app_id: ${{ secrets.STATEFORGE_CI_APP_ID }}
      source_private_key: ${{ secrets.STATEFORGE_CI_PRIVATE_KEY }}
