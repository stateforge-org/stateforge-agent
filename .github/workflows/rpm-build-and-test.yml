name: RPM / Build and test

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the RPM artifact passed between jobs.
        required: false
        type: string
        default: stateforge-agent-rpm
      retention-days:
        description: Number of days to retain RPMs and evidence.
        required: false
        type: number
        default: 14
      provider-ref:
        description: Provider revision used by the dummy Provider.
        required: false
        type: string
        default: mvp/implementation
      protocol-ref:
        description: Protocol revision shared by Agent and Provider.
        required: false
        type: string
        default: mvp/implementation
    secrets:
      source_app_id:
        description: GitHub App ID with read access to dependency sources.
        required: true
      source_private_key:
        description: Private key for the dependency-source GitHub App.
        required: true
    outputs:
      artifact-name:
        description: Tested RPM artifact, suitable for a later publish job.
        value: ${{ jobs.build.outputs.artifact-name }}
      provider-commit:
        description: Immutable Provider commit used by the test run.
        value: ${{ jobs.resolve.outputs.provider-commit }}
      protocol-commit:
        description: Immutable Protocol commit used by the test run.
        value: ${{ jobs.resolve.outputs.protocol-commit }}
      version:
        description: Version embedded in the tested RPM.
        value: ${{ jobs.build.outputs.version }}
      rpm-sha256:
        description: SHA-256 digest of the tested binary RPM.
        value: ${{ jobs.build.outputs.rpm-sha256 }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve dependency revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      provider-commit: ${{ steps.dependencies.outputs.provider-commit }}
      protocol-commit: ${{ steps.dependencies.outputs.protocol-commit }}
    steps:
      - name: Check out dependency resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mint dependency source token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.source_app_id }}
          private-key: ${{ secrets.source_private_key }}
          owner: stateforge-org
          repositories: |
            stateforge-protocol
            stateforge-provider-python
          permission-contents: read

      - name: Resolve requested dependency revisions once
        id: dependencies
        uses: ./.github/actions/dependencies/resolve
        with:
          repository-token: ${{ steps.source-token.outputs.token }}
          provider-ref: ${{ inputs.provider-ref }}
          protocol-ref: ${{ inputs.protocol-ref }}

  source:
    needs: resolve
    uses: ./.github/workflows/source-validation.yml
    with:
      protocol-commit: ${{ needs.resolve.outputs.protocol-commit }}

  build:
    uses: ./.github/workflows/rpm-build.yml
    with:
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}

  test:
    needs:
      - resolve
      - build
    uses: ./.github/workflows/rpm-installed-test.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      evidence-name: stateforge-agent-system-test-${{ github.run_id }}
      fixture-artifact-name: stateforge-provider-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      provider-commit: ${{ needs.resolve.outputs.provider-commit }}
      provider-ref: ${{ inputs.provider-ref }}
      protocol-commit: ${{ needs.resolve.outputs.protocol-commit }}
      protocol-ref: ${{ inputs.protocol-ref }}
      retention-days: ${{ inputs.retention-days }}
    secrets:
      source_app_id: ${{ secrets.source_app_id }}
      source_private_key: ${{ secrets.source_private_key }}
