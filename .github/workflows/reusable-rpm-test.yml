name: Reusable installed RPM test

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Build artifact produced by the reusable RPM build.
        required: true
        type: string
      evidence-name:
        description: Name used to publish installed-package evidence.
        required: false
        type: string
        default: stateforge-agent-rpm-test-evidence
      retention-days:
        description: Number of days to retain installed-package evidence.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  test:
    name: Test the installed RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out test automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact RPM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/rpm

      - name: Test installed RPM
        uses: ./.github/actions/test-installed-rpm

      - name: Upload installed-package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.evidence-name }}
          path: dist/rpm-test-evidence
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
