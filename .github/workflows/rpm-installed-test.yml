name: RPM / Installed Agent and Provider test

on:
  workflow_call:
    inputs:
      artifact-name:
        description: RPM artifact produced by rpm-build.yml.
        required: true
        type: string
      evidence-name:
        description: Name used to publish installed-system evidence.
        required: false
        type: string
        default: stateforge-agent-system-test-evidence
      fixture-artifact-name:
        description: Name used to transfer the immutable Provider fixture bundle.
        required: false
        type: string
        default: stateforge-provider-fixture
      provider-ref:
        description: Requested Provider revision retained for provenance.
        required: false
        type: string
        default: mvp/implementation
      provider-commit:
        description: Immutable Provider commit selected by the caller.
        required: true
        type: string
      protocol-ref:
        description: Requested Protocol revision retained for provenance.
        required: false
        type: string
        default: mvp/implementation
      protocol-commit:
        description: Immutable Protocol commit selected by the caller.
        required: true
        type: string
      retention-days:
        description: Number of days to retain installed-system evidence.
        required: false
        type: number
        default: 14
    secrets:
      source_app_id:
        description: GitHub App ID with read access to dependency sources.
        required: true
      source_private_key:
        description: Private key for the dependency-source GitHub App.
        required: true

permissions:
  contents: read

jobs:
  fixture:
    name: Build Provider fixture bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out test automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mint dependency source token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.source_app_id }}
          private-key: ${{ secrets.source_private_key }}
          owner: stateforge-org
          repositories: |
            stateforge-protocol
            stateforge-provider-python
          permission-contents: read

      - name: Build dependency packages and stage fixture
        uses: ./.github/actions/provider/create-fixture
        with:
          repository-token: ${{ steps.source-token.outputs.token }}
          provider-commit: ${{ inputs.provider-commit }}
          provider-ref: ${{ inputs.provider-ref }}
          protocol-commit: ${{ inputs.protocol-commit }}
          protocol-ref: ${{ inputs.protocol-ref }}

      - name: Upload immutable Provider fixture bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.fixture-artifact-name }}
          path: dist/provider-fixture
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  scenario:
    name: Installed / ${{ matrix.scenario }}
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manifest-exchange
          - capability-assessment
          - capability-timeout
          - capability-malformed
          - capability-mismatch
          - capability-limits
          - provider-availability
          - trigger-publication
          - trigger-storage-failure
          - multiple-providers
          - invalid-descriptor
          - uninstall-reinstall
    steps:
      - name: Check out test automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact RPM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/rpm

      - name: Download exact Provider fixture bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.fixture-artifact-name }}
          path: dist/provider-fixture

      - name: Run manifest-exchange scenario
        if: ${{ matrix.scenario == 'manifest-exchange' }}
        uses: ./.github/actions/rpm/test-installed/smoke/manifest-exchange
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run Capability Assessment scenario
        if: ${{ matrix.scenario == 'capability-assessment' }}
        uses: ./.github/actions/rpm/test-installed/capability/assessment
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run Capability Assessment boundary scenario
        if: ${{ startsWith(matrix.scenario, 'capability-') && matrix.scenario != 'capability-assessment' }}
        uses: ./.github/actions/rpm/test-installed/capability/boundary
        with:
          scenario: ${{ matrix.scenario }}
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run multiple-Providers scenario
        if: ${{ matrix.scenario == 'multiple-providers' }}
        uses: ./.github/actions/rpm/test-installed/lifecycle/multiple-providers
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run Provider-availability scenario
        if: ${{ matrix.scenario == 'provider-availability' }}
        uses: ./.github/actions/rpm/test-installed/health/provider-availability
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run Trigger Publication scenario
        if: ${{ matrix.scenario == 'trigger-publication' }}
        uses: ./.github/actions/rpm/test-installed/triggers/publication
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run Trigger Publication storage-failure scenario
        if: ${{ matrix.scenario == 'trigger-storage-failure' }}
        uses: ./.github/actions/rpm/test-installed/triggers/storage-failure
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run invalid-descriptor scenario
        if: ${{ matrix.scenario == 'invalid-descriptor' }}
        uses: ./.github/actions/rpm/test-installed/adversarial/invalid-descriptor
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Run uninstall-reinstall scenario
        if: ${{ matrix.scenario == 'uninstall-reinstall' }}
        uses: ./.github/actions/rpm/test-installed/destructive/uninstall-reinstall
        with:
          evidence-directory: dist/agent-system-test-evidence/${{ matrix.scenario }}
          fixture-directory: dist/provider-fixture

      - name: Upload installed-system evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.evidence-name }}-${{ matrix.scenario }}
          path: dist/agent-system-test-evidence/${{ matrix.scenario }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
